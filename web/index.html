<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>鲸鱼 API</title>
    <meta name="title" content="鲸鱼 API" />
    <!-- description 由路由 head（HeadContent）按页面注入，这里不放静态副本：
         爬虫遇到重复的 meta[name=description] 会取第一个，静态旧文案会压过
         各页面的按页文案（见 web/src/lib/seo.ts）。 -->
    <!-- Bing搜索引擎 -->
    <meta name="msvalidate.01" content="89831DFE50C593870144A7151DAD5990" />
    <!-- 百度搜索引擎 -->
    <meta name="baidu-site-verification" content="codeva-prS0cfiLS2" />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
